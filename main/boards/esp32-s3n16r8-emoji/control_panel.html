<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f5ef" />
    <title>DeskEmoji · 机器人控制台</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172e27;
        --muted: #586b60;
        --line: #d4dcd1;
        --paper: #fffef8;
        --green: #276047;
        --accent: #c6f184;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f4f5ef;
        color: var(--ink);
        font:
          16px/1.55 'DM Sans',
          'Microsoft YaHei',
          system-ui,
          sans-serif;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 28px 24px 48px;
      }
      header,
      .row,
      .top,
      .axes,
      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      header {
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 18px;
        font-weight: 750;
        letter-spacing: -0.5px;
      }
      .face {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        background: var(--ink);
        width: 34px;
        height: 25px;
        border-radius: 8px;
      }
      .face:before,
      .face:after {
        content: '';
        width: 4px;
        height: 8px;
        border-radius: 3px;
        background: var(--accent);
      }
      #connection {
        font-size: 13px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 7px;
      }
      #connection:before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #a18b5d;
      }
      #connection.online:before {
        background: #387555;
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      h1 {
        font-size: clamp(28px, 4vw, 40px);
        line-height: 1.2;
        letter-spacing: -1.4px;
      }
      .top {
        margin: 28px 0 20px;
      }
      .model,
      output,
      .value {
        font-family: 'IBM Plex Mono', Consolas, monospace;
        font-variant-numeric: tabular-nums;
      }
      .model {
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 1px;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }
      section {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 22px;
      }
      h2 {
        font-size: 19px;
        line-height: 1.4;
      }
      .sub {
        font-size: 13px;
        color: var(--muted);
      }
      .mode {
        color: var(--green);
        font-size: 13px;
      }
      .viewport {
        position: relative;
        height: 128px;
        margin-top: 18px;
        border-radius: 10px;
        overflow: hidden;
        background-color: #19372e;
        background-image: radial-gradient(#466253 1px, transparent 1px);
        background-size: 12px 12px;
      }
      .viewport:before,
      .viewport:after {
        content: '';
        position: absolute;
        background: #42604f;
      }
      .viewport:before {
        top: 50%;
        height: 1px;
        width: 100%;
      }
      .viewport:after {
        left: 50%;
        height: 100%;
        width: 1px;
      }
      .travel {
        position: absolute;
        inset: 19px 26px;
        z-index: 1;
      }
      #marker {
        position: absolute;
        width: 38px;
        height: 25px;
        transform: translate(-50%, -50%);
        background: var(--accent);
        border-radius: 8px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        display: flex;
      }
      #marker[hidden] {
        display: none;
      }
      #marker:before,
      #marker:after {
        content: '';
        width: 4px;
        height: 9px;
        border-radius: 2px;
        background: var(--ink);
      }
      .axes {
        margin: 12px 0 18px;
        justify-content: space-around;
        border-bottom: 1px solid var(--line);
        padding-bottom: 14px;
      }
      .axes span {
        font-size: 13px;
        color: var(--muted);
        margin-right: 8px;
      }
      .axes output {
        font-size: 20px;
      }
      .pad {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 76px));
        grid-template-areas: '. up .' 'left center right' '. down .';
        justify-content: center;
        gap: 6px;
        margin: 14px 0 16px;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        touch-action: manipulation;
        border: 1px solid var(--line);
        background: #edf1e8;
        border-radius: 9px;
        min-height: 42px;
        padding: 7px 12px;
      }
      button:enabled:hover {
        border-color: #77927f;
      }
      button:enabled:active {
        background: #d7e6cd;
      }
      button:disabled,
      input:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid #418261;
        outline-offset: 3px;
      }
      .pad button {
        height: 46px;
        font-weight: 650;
      }
      .pad [data-command='center'] {
        background: var(--accent);
        border-color: #accc79;
      }
      .pad [data-command='up'] {
        grid-area: up;
      }
      .pad [data-command='down'] {
        grid-area: down;
      }
      .pad [data-command='left'] {
        grid-area: left;
      }
      .pad [data-command='right'] {
        grid-area: right;
      }
      .pad [data-command='center'] {
        grid-area: center;
      }
      .foot {
        border-top: 1px solid var(--line);
        padding-top: 14px;
      }
      .foot button {
        font-size: 13px;
        background: transparent;
      }
      .hardware h2 {
        margin-bottom: 20px;
      }
      .device {
        padding: 17px 0;
        border-top: 1px solid var(--line);
      }
      .device:last-child {
        padding-bottom: 0;
      }
      .device strong,
      .device label {
        display: block;
        font-size: 15px;
      }
      .hardware output {
        font-size: 21px;
      }
      input[type='range'] {
        width: 100%;
        accent-color: var(--green);
        margin: 12px 0 0;
        min-height: 28px;
      }
      #gesture {
        font-size: 14px;
        min-width: 78px;
      }
      #gesture[aria-pressed='true'] {
        background: #e4f2d8;
        border-color: #b2cc9c;
      }
      #message {
        font-size: 13px;
        color: #8b4434;
        margin-top: 12px;
      }
      @media (max-width: 680px) {
        main {
          padding: 18px 14px 28px;
        }
        .layout {
          grid-template-columns: 1fr;
        }
        .top {
          margin: 20px 0 14px;
          align-items: baseline;
          flex-wrap: wrap;
        }
        .model {
          font-size: 10px;
        }
        section {
          padding: 17px;
        }
        .viewport {
          height: 100px;
        }
        .hardware h2 {
          margin-bottom: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="brand"><i class="face" aria-hidden="true"></i>DeskEmoji</div>
        <span id="connection" role="status">正在连接</span>
      </header>
      <div class="top">
        <h1>机器人控制台</h1>
        <span class="model">ESP32-S3 N16R8</span>
      </div>
      <div class="layout">
        <section aria-labelledby="servo-title">
          <div class="section-title">
            <h2 id="servo-title">头部舵机</h2>
            <span class="mode" id="mode">等待读取</span>
          </div>
          <div class="viewport" aria-hidden="true">
            <div class="travel"><i id="marker" hidden></i></div>
          </div>
          <div class="axes" aria-label="舵机指令角度">
            <div><span>水平</span><output id="x">—</output></div>
            <div><span>垂直</span><output id="y">—</output></div>
          </div>
          <div class="row">
            <label for="manual-speed">手动速度</label>
            <output id="speed-value" for="manual-speed">—</output>
          </div>
          <input id="manual-speed" type="range" step="1" disabled />
          <div class="pad" aria-label="头部方向">
            <button disabled data-command="up" aria-label="抬头">↑</button>
            <button disabled data-command="left" aria-label="左转">←</button>
            <button disabled data-command="center">回中</button>
            <button disabled data-command="right" aria-label="右转">→</button>
            <button disabled data-command="down" aria-label="低头">↓</button>
          </div>
          <div class="row foot">
            <span id="step" class="sub">点方向键接管舵机</span
            ><button disabled data-command="auto">恢复自动动作</button>
          </div>
          <details id="center-tools">
            <summary>舵机中位校准</summary>
            <p>点回中，等头部停稳。在底座正前方、与头部同高处放一个标记，用上方方向键每次 1° 对准它。</p>
            <p id="offsets"></p>
            <p id="center-range"></p>
            <button id="save-center" disabled>设为正中</button>
            <button id="reset-center" disabled>恢复出厂中位</button>
          </details>
        </section>
        <section class="hardware" aria-labelledby="hardware-title">
          <h2 id="hardware-title">连接的硬件</h2>
          <div class="device">
            <div class="row">
              <div>
                <label for="volume"><strong>扬声器音量</strong></label
                ><span class="sub">MAX98357A</span>
              </div>
              <output id="level" for="volume">—</output>
            </div>
            <input disabled id="volume" type="range" min="0" max="100" value="0" />
          </div>
          <div class="row device">
            <div><strong>手势响应</strong><span class="sub">PAJ7620U2</span></div>
            <button disabled id="gesture" aria-label="手势响应" aria-pressed="false">等待读取</button>
          </div>
        </section>
      </div>
      <p id="message" role="alert"></p>
    </main>
    <script>
      const el = (id) => document.getElementById(id)
      const speed = el('manual-speed')
      const buttons = [...document.querySelectorAll('[data-command]')]
      let state,
        online = false,
        sending = false,
        reading,
        editingVolume = false,
        editingSpeed = false,
        pendingSpeed = null

      function updateControls() {
        const locked = !online || sending
        const limits = state
          ? {
              left: state.x <= state.minX,
              right: state.x >= state.maxX,
              up: state.y <= state.minY,
              down: state.y >= state.maxY,
              auto: state.mode === "auto",
            }
          : {}
        for (const button of buttons) button.disabled = locked || !!limits[button.dataset.command]
        speed.disabled = !online || state?.manualSpeed == null
        const canCalibrate = !locked && state.mode === 'manual' && !state.moving
        el('save-center').disabled = !canCalibrate
        el('reset-center').disabled = !canCalibrate || !(state.centerOffsetX || state.centerOffsetY)
        el('volume').disabled = locked
        el('gesture').disabled = locked || state?.gesture == null
      }

      function render(next) {
        state = next
        online = true
        el('connection').className = 'online'
        el('connection').textContent = '设备在线'
        el('mode').textContent = ({manual:'手动控制中',follow:'视觉跟随中',auto:'自动动作中'})[state.mode]
        el('step').textContent = state.moving ? (state.targetX === 90 && state.targetY === 90 ? '正在回中' : '移动中') : '每次移动 ' + (el('center-tools').open ? 1 : state.step) + '°'
        el('offsets').textContent = '已保存偏移：水平 ' + state.centerOffsetX + '°，俯仰 ' + state.centerOffsetY + '°'
        el('center-range').textContent = '从正中可转：左 ' + (90-state.minX) + '°，右 ' + (state.maxX-90) + '°，上 ' + (90-state.minY) + '°，下 ' + (state.maxY-90) + '°'
        for (const axis of ['x', 'y']) el(axis).textContent = state[axis] + '°' + (state.moving ? ' → ' + Math.round(state[axis === 'x' ? 'targetX' : 'targetY']) + '°' : '')
        const marker = el('marker')
        marker.hidden = false
        marker.style.left = ((state.x - state.minX) * 100) / (state.maxX - state.minX) + '%'
        marker.style.top = ((state.y - state.minY) * 100) / (state.maxY - state.minY) + '%'
        if (!editingSpeed && pendingSpeed === null) {
          speed.min = state.manualSpeedMin
          speed.max = state.manualSpeedMax
          speed.value = state.manualSpeed
          el('speed-value').textContent = speed.value + '°/秒'
        }
        if (!editingVolume) {
          el('volume').value = state.volume
          el('level').textContent = state.volume + '%'
        }
        el('gesture').textContent =
          state.gesture == null ? '不可用' : state.gesture ? '已开启' : '已关闭'
        el('gesture').setAttribute('aria-pressed', String(state.gesture === true))
        updateControls()
      }

      function disconnected(message) {
        online = false
        editingVolume = false
        editingSpeed = false
        pendingSpeed = null
        el('speed-value').textContent = '—'
        el('connection').className = ''
        el('connection').textContent = '设备离线'
        el('mode').textContent = '等待读取'
        el('message').textContent = message
        updateControls()
      }

      async function refresh() {
        if (sending || reading || document.hidden) return
        const controller = new AbortController()
        reading = controller
        const timer = setTimeout(() => controller.abort(), 4000)
        try {
          const response = await fetch('/api/state', { signal: controller.signal, cache: 'no-store' })
          if (!response.ok) throw Error()
          const next = await response.json()
          if (reading === controller) {
            if (!online) el('message').textContent = ''
            render(next)
          }
        } catch {
          if (reading === controller) disconnected('无法读取设备状态，请检查 Wi-Fi。页面会自动重连。')
        } finally {
          clearTimeout(timer)
          if (reading === controller) reading = null
        }
      }

      async function send(command, path = '/api/control', invalidMessage = '请检查角度。每轴中位修正范围为 ±15°。') {
        if (!online || sending) return
        if (reading) {
          reading.abort()
          reading = null
        }
        sending = true
        updateControls()
        const controller = new AbortController()
        const timer = setTimeout(() => controller.abort(), 4000)
        try {
          const response = await fetch(path, {
            method: 'POST',
            headers: { 'X-Desk-Control': '1' },
            body: command,
            signal: controller.signal,
          })
          if (path === '/api/follow' && (response.status === 400 || response.status === 409)) {
            el('message').textContent = response.status === 409 ? '控制状态已变化，请在手动模式下等到位后重试。' : invalidMessage
            render(state)
            return
          }
          if (!response.ok) throw Error()
          render(await response.json())
          el('message').textContent = ''
        } catch {
          disconnected('未收到操作确认。请先核对设备角度和状态，再次操作。')
        } finally {
          clearTimeout(timer)
          sending = false
          updateControls()
          flushSpeed()
        }
      }

      for (const button of buttons) button.onclick = () => {
        const command = button.dataset.command
        const deltas = {up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]}
        if (el('center-tools').open && deltas[command]) {
          const [dx,dy] = deltas[command]
          const x = Math.max(state.minX, Math.min(state.maxX, Math.round(state.targetX)+dx))
          const y = Math.max(state.minY, Math.min(state.maxY, Math.round(state.targetY)+dy))
          send(JSON.stringify({op:'manual', x, y}), '/api/follow')
        } else send(command)
      }
      for (const [button, op] of [['save-center','save_center'], ['reset-center','reset_center']])
        el(button).onclick = () => send(JSON.stringify({op, boot:state.boot, generation:state.generation}), '/api/follow')
      el('gesture').onclick = () => send(state.gesture ? 'gesture=off' : 'gesture=on')
      function flushSpeed() {
        if (!online || sending || pendingSpeed === null) return
        const value = pendingSpeed
        pendingSpeed = null
        send(JSON.stringify({op: 'speed', value}), '/api/follow', '速度超出设备支持的范围。')
      }
      speed.oninput = () => {
        editingSpeed = true
        el('speed-value').textContent = speed.value + '°/秒'
      }
      speed.onchange = () => {
        editingSpeed = false
        pendingSpeed = Number(speed.value)
        flushSpeed()
      }
      speed.onpointercancel = speed.onblur = () => {
        if (!editingSpeed) return
        editingSpeed = false
        if (online) render(state)
      }
      el('volume').oninput = (event) => {
        editingVolume = true
        el('level').textContent = event.target.value + '%'
      }
      el('volume').onchange = (event) => {
        editingVolume = false
        send('volume=' + event.target.value)
      }
      el('volume').onblur = el('volume').onpointercancel = () => {
        editingVolume = false
      }
      document.addEventListener('visibilitychange', refresh)
      if (location.protocol === 'file:') {
        disconnected('请在同一 Wi-Fi 中打开设备 IP，即可连接硬件。')
      } else {
        refresh()
        setInterval(refresh, 700)
      }
    </script>
  </body>
</html>
